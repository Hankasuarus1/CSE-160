<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coin Collector</title>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      canvas {
        display: block;
      }

      #scoreDisplay {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 24px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 16px;
        border-radius: 8px;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <div id="scoreDisplay">Score: 0</div>

    <script type="module">
      import * as THREE from "three";
      import { setupCamera } from "./camera.js";
      import { setupPlayerControls } from "./playerControls.js";
      import { loadObjModel } from "./modelLoader.js";

      const scene = new THREE.Scene();

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const camera = setupCamera(renderer);

      addSkybox(scene);
      addLights(scene);
      addGround(scene);

      const primaryShapes = [];
      const coins = [];
      let score = 0;

      const scoreDisplay = document.getElementById("scoreDisplay");

      function addPrimaryShape(
        scene,
        geometry,
        material,
        position,
        rotation = [0, 0, 0]
      ) {
        const mesh = new THREE.Mesh(geometry, material);

        mesh.position.set(position[0], position[1], position[2]);
        mesh.rotation.set(rotation[0], rotation[1], rotation[2]);

        scene.add(mesh);
        primaryShapes.push(mesh);

        return mesh;
      }

      // Materials

      const textureLoader = new THREE.TextureLoader();

      const playerMaterial = new THREE.MeshStandardMaterial({
        color: 0x44aa88,
      });

      const coinMaterial = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.5,
        roughness: 0.25,
      });

      const coinStripeMaterial = new THREE.MeshStandardMaterial({
        color: 0x8b6508,
      });

      const crateTexture = textureLoader.load("./textures/crate.jpg");
      crateTexture.colorSpace = THREE.SRGBColorSpace;

      const crateMaterial = new THREE.MeshStandardMaterial({
        map: crateTexture,
      });

      const trunkMaterial = new THREE.MeshStandardMaterial({
        color: 0x6b3f1d,
      });

      const leafMaterial = new THREE.MeshStandardMaterial({
        color: 0x228b22,
      });

      const player = new THREE.Group();
      player.position.set(0, 0, 0);
      scene.add(player);

      loadObjModel(scene, {
        objPath: "./models/ironman/IronMan.obj",
        mtlPath: "./models/ironman/IronMan.mtl",
        position: [0, 0, 0],
        rotation: [0, Math.PI, 0],
        scale: 0.008,
      }).then((ironManModel) => {

        scene.remove(ironManModel);
        player.add(ironManModel);

        ironManModel.position.set(0, 0, 0);
        ironManModel.rotation.set(0, 0, 0);
        ironManModel.scale.set(0.008, 0.008, 0.008);
      });

      function createCoin(x, z) {
        const coinGroup = new THREE.Group();

        const coinBody = new THREE.Mesh(
          new THREE.CylinderGeometry(0.35, 0.35, 0.08, 32),
          coinMaterial
        );

        coinBody.rotation.x = Math.PI / 2;
        coinGroup.add(coinBody);

        const stripe = new THREE.Mesh(
          new THREE.BoxGeometry(0.08, 0.6, 0.03),
          coinStripeMaterial
        );

        stripe.position.z = 0.06;
        coinGroup.add(stripe);

        coinGroup.position.set(x, 0.75, z);
        coinGroup.userData.baseY = 0.75;

        scene.add(coinGroup);
        coins.push(coinGroup);

        primaryShapes.push(coinBody);

        return coinGroup;
      }

      const coinPositions = [
        [2, 2],
        [4, 1],
        [-3, 2],
        [-5, -1],
        [1, -4],
        [3, -3],
        [-2, -5],
        [6, 4],
        [-6, 4],
        [5, -5],
        [-5, -5],
        [0, 6],
      ];

      for (const position of coinPositions) {
        createCoin(position[0], position[1]);
      }

      const cratePositions = [
        [3, 0.5, 5],
        [-4, 0.5, 3],
        [5, 0.5, -2],
        [-3, 0.5, -4],
      ];

      for (const position of cratePositions) {
        addPrimaryShape(
          scene,
          new THREE.BoxGeometry(1, 1, 1),
          crateMaterial,
          position
        );
      }

      addCrateSpotLights(scene, cratePositions);

      const treePositions = [
        [7, 0, 7],
        [-7, 0, 7],
        [7, 0, -7],
        [-7, 0, -7],
        [8, 0, 0],
        [-8, 0, 0],
        [0, 0, 8],
        [0, 0, -8],
      ];

      for (const position of treePositions) {
        addPrimaryShape(
          scene,
          new THREE.CylinderGeometry(0.2, 0.2, 1.2, 16),
          trunkMaterial,
          [position[0], 0.6, position[2]]
        );

        addPrimaryShape(
          scene,
          new THREE.ConeGeometry(0.8, 1.5, 24),
          leafMaterial,
          [position[0], 1.95, position[2]]
        );
      }

      console.log("Primary 3D shape count:", primaryShapes.length);

      const playerControls = setupPlayerControls(player, camera);
      const clock = new THREE.Clock();


      function addLights(scene) {

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.12);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xbfd8ff, 0.35);
        directionalLight.position.set(5, 10, 5);
        scene.add(directionalLight);
      }

      function addCrateSpotLights(scene, cratePositions) {
        for (const position of cratePositions) {
          const x = position[0];
          const z = position[2];

          const spotLight = new THREE.SpotLight(
            0xffaa44,
            5,           
            10,           
            Math.PI / 6, 
            0.45,         
            1.5           
          );

          spotLight.position.set(x, 4, z);

          const target = new THREE.Object3D();
          target.position.set(x, 0.5, z);
          scene.add(target);

          spotLight.target = target;
          scene.add(spotLight);

          const lampMarker = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 16, 8),
            new THREE.MeshBasicMaterial({ color: 0xffaa44 })
          );

          lampMarker.position.copy(spotLight.position);
          scene.add(lampMarker);
        }
      }

      function addGround(scene) {
        const textureLoader = new THREE.TextureLoader();
        const groundTexture = textureLoader.load("./textures/grass.jpg");

        groundTexture.wrapS = THREE.RepeatWrapping;
        groundTexture.wrapT = THREE.RepeatWrapping;
        groundTexture.repeat.set(20, 20);

        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({
          map: groundTexture,
          side: THREE.DoubleSide,
        });

        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;

        scene.add(ground);
      }

      function addSkybox(scene) {
        const cubeTextureLoader = new THREE.CubeTextureLoader();

        const skyboxTexture = cubeTextureLoader.load([
          "./skybox/px.jpg",
          "./skybox/nx.jpg",
          "./skybox/py.jpg",
          "./skybox/ny.jpg",
          "./skybox/pz.jpg",
          "./skybox/nz.jpg",
        ]);

        scene.background = skyboxTexture;
      }

      function updateCoins(deltaTime) {
        const elapsedTime = clock.getElapsedTime();

        for (let i = coins.length - 1; i >= 0; i--) {
          const coin = coins[i];

          coin.rotation.y += deltaTime * 5;

          coin.position.y =
            coin.userData.baseY + Math.sin(elapsedTime * 3 + i) * 0.1;

          const distance = player.position.distanceTo(coin.position);

          if (distance < 0.8) {
            scene.remove(coin);
            coins.splice(i, 1);

            score++;
            scoreDisplay.textContent = "Score: " + score;

            console.log("Score:", score);
          }
        }
      }

      function animate() {
        const deltaTime = clock.getDelta();

        playerControls.update(deltaTime);
        updateCoins(deltaTime);

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    </script>
  </body>
</html>
